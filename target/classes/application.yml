spring:
  application:
    name: state-machine-project
  datasource:
    url: jdbc:mysql://localhost:3306/state_machine_db?createDatabaseIfNotExist=true
    username: user_sm
    password: password_sm
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.statemachine: DEBUG
